<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenota Pulizie - Roberto</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Calendly -->
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #007bff;
        }

        .subtitle {
            color: #666;
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.2em;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 20px;
        }

        .steps {
            text-align: left;
            margin: 20px 0;
        }

        .steps p {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .btn-book {
            background: #007bff;
            color: white;
            padding: 18px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin: 25px 0;
            transition: 0.3s;
        }

        .btn-book:hover {
            background: #0056b3;
            transform: scale(1.03);
        }

        .whatsapp {
            background: #25d366;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85em;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🧹 Pulizie Casa</h1>
    <p class="subtitle">Disponibile Sabato e Domenica</p>

    <p class="price">💰 A partire da 5€ / ora</p>

    <div class="steps">
        <p>1️⃣ Clicca su prenota</p>
        <p>2️⃣ Scegli giorno e orario</p>
        <p>3️⃣ Conferma in 30 secondi</p>
    </div>

    <a href="#" onclick="openCalendly()" class="btn-book">
        📅 PRENOTA ORA
    </a>

    <p><small>Mostra solo orari disponibili</small></p>

    <a href="https://wa.me/393473055057" class="whatsapp">
        💬 Scrivimi su WhatsApp
    </a>

    <div class="footer">
        © Roberto Pulizie
    </div>
</div>

<script src="https://assets.calendly.com/assets/external/widget.js"></script>

<script>
function openCalendly() {
    Calendly.initPopupWidget({
        url: 'https://calendly.com/pontiggiaroberto/pulizia-casa'
    });
}
</script>

</body>
</html>
